[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "notifique-sdk"
version = "0.2.1"
description = "SDK oficial Notifique para Python"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Notifique", email = "suporte@notifique.dev"}
]
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[tool.setuptools.package-data]
notifique = ["operations.json", "generated/api.py", "generated/__init__.py", "generated/models/**/*"]

[project.urls]
Homepage = "https://docs.notifique.dev"
Repository = "https://github.com/notifique-dev/notifique-sdk/tree/main/packages/sdk-python"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "requests-mock>=1.11.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
