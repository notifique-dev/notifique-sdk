name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node tests and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generated OpenAPI artifacts are committed in-repo. Regenerate locally with
      # sibling ../notifique-docs (see README); CI validates the committed registry.
      - name: Run tests
        run: npm test

      - name: Smoke test (prod public endpoints)
        run: npm run smoke:prod

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  go:
    name: Go SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run go tests
        working-directory: packages/sdk-go
        run: go test ./...

  python:
    name: Python SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: pip install -e "packages/sdk-python[dev]"

      - name: Run pytest
        run: pytest packages/sdk-python/tests

  java:
    name: Java SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run maven tests
        working-directory: packages/sdk-java
        run: mvn -B test

  dotnet:
    name: .NET SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore packages/sdk-dotnet/Notifique.sln

      - name: Test
        run: dotnet test packages/sdk-dotnet/tests/Notifique.Tests/Notifique.Tests.csproj -c Release --no-restore

  php:
    name: PHP SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install and test
        working-directory: packages/sdk-php
        run: |
          composer install --no-interaction
          composer test

  elixir:
    name: Elixir SDK tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.16"
          otp-version: "26"

      - name: Test
        working-directory: packages/sdk-elixir
        run: |
          mix deps.get
          mix test
